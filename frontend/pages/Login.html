<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Death Mart</title>
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTzSdFnao4Si8fzlM5IozWw6VlbcCylDT4Oln2I565WpQ&s=10">
    <link rel="stylesheet" href="../styles/index.css">
</head>
<body>

    <!-- Header -->
    <header class="site-header"></header>

    <main style="padding: 60px 20px; display: flex; align-items: center; justify-content: center; flex: 1;">
        <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 40px; width: 100%; max-width: 440px; box-shadow: var(--shadow-card);">
            <div style="text-align: center; margin-bottom: 28px;">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTzSdFnao4Si8fzlM5IozWw6VlbcCylDT4Oln2I565WpQ&s=10" alt="Logo" style="width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--primary-red); margin-bottom: 12px;">
                <h2 class="gothic-title" style="font-size: 26px; color: #fff;">SIGN IN TO DEATH MART</h2>
                <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Enter your credentials to access your cursed inventory.</p>
            </div>

            <form id="login-form">
                <div style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px;">Email Address</label>
                    <input type="email" id="email" placeholder="name@domain.com" required style="width: 100%;">
                </div>

                <div style="margin-bottom: 24px;">
                    <label style="display: block; font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px;">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required style="width: 100%;">
                </div>

                <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-bottom: 20px;">
                    Sign In
                </button>
            </form>

            <div style="text-align: center; font-size: 13px; color: var(--text-muted); padding-top: 16px; border-top: 1px solid var(--border-color);">
                Don't have an account yet? <a href="./Register.html" style="color: var(--primary-red); font-weight: 600;">Register here</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer"></footer>

    <!-- Scripts -->
    <script src="../scripts/api.js"></script>
    <script src="../scripts/components.js"></script>
    <script src="../scripts/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderHeader('login');
            renderFooter();
        });
    </script>
</body>
</html>
