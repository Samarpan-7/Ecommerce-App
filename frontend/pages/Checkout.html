<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout & Pact Confirmation — Death Mart</title>
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTzSdFnao4Si8fzlM5IozWw6VlbcCylDT4Oln2I565WpQ&s=10">
    <link rel="stylesheet" href="../styles/index.css">
</head>
<body>

    <!-- Header -->
    <header class="site-header"></header>

    <main style="padding: 40px 0 80px;">
        <div class="container">
            <div style="margin-bottom: 30px;">
                <span class="section-subtitle">Final Step</span>
                <h1 class="gothic-title" style="font-size: 38px; color: var(--text-main); margin-top: 4px;">SEAL THE PACT & CHECKOUT</h1>
            </div>

            <div style="display: grid; grid-template-columns: 1.8fr 1.2fr; gap: 36px; align-items: flex-start;">
                <!-- Left Column: Shipping & Payment -->
                <div>
                    <!-- Step 1: Shipping Address -->
                    <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 24px; margin-bottom: 24px;">
                        <h3 style="font-size: 18px; font-weight: 600; margin-bottom: 16px; color: #fff; display: flex; align-items: center; gap: 8px;">
                            <span class="badge badge-red">1</span> Shipping Address
                        </h3>

                        <!-- Saved Addresses -->
                        <div id="saved-addresses-container">
                            <p style="font-size: 14px; color: var(--text-muted);">Loading your addresses...</p>
                        </div>

                        <!-- Toggle New Address Form -->
                        <div style="margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border-color);">
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; color: var(--text-main);">
                                <input type="checkbox" id="new-address-toggle" onchange="toggleNewAddressForm(this.checked)">
                                <span>Ship to a different / new address</span>
                            </label>
                        </div>

                        <!-- New Address Form Fields -->
                        <div id="new-address-fields" style="display: none; margin-top: 16px;">
                            <div style="margin-bottom: 12px;">
                                <label style="display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 4px;">Street Address *</label>
                                <input type="text" id="street" placeholder="e.g. 104-B Kanto District Boulevard" style="width: 100%;">
                            </div>

                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
                                <div>
                                    <label style="display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 4px;">City *</label>
                                    <input type="text" id="city" placeholder="e.g. Tokyo" style="width: 100%;">
                                </div>
                                <div>
                                    <label style="display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 4px;">State *</label>
                                    <input type="text" id="state" placeholder="e.g. Kanto" style="width: 100%;">
                                </div>
                            </div>

                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                                <div>
                                    <label style="display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 4px;">Zip / Postal Code *</label>
                                    <input type="text" id="zipCode" placeholder="e.g. 100-0001" style="width: 100%;">
                                </div>
                                <div>
                                    <label style="display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 4px;">Country</label>
                                    <input type="text" id="country" value="India" style="width: 100%;">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Step 2: Payment Method -->
                    <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 24px;">
                        <h3 style="font-size: 18px; font-weight: 600; margin-bottom: 16px; color: #fff; display: flex; align-items: center; gap: 8px;">
                            <span class="badge badge-red">2</span> Payment Method
                        </h3>

                        <div style="display: flex; flex-direction: column; gap: 10px;">
                            <label style="display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-sm); cursor: pointer;">
                                <input type="radio" name="paymentMethod" value="UPI" checked>
                                <div>
                                    <strong>Instant UPI / QR Code</strong>
                                    <div style="font-size: 12px; color: var(--text-muted);">GPay, PhonePe, Paytm, BHIM</div>
                                </div>
                            </label>

                            <label style="display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-sm); cursor: pointer;">
                                <input type="radio" name="paymentMethod" value="CREDIT_CARD">
                                <div>
                                    <strong>Credit or Debit Card</strong>
                                    <div style="font-size: 12px; color: var(--text-muted);">Visa, MasterCard, RuPay</div>
                                </div>
                            </label>

                            <label style="display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-sm); cursor: pointer;">
                                <input type="radio" name="paymentMethod" value="NET_BANKING">
                                <div>
                                    <strong>Net Banking</strong>
                                    <div style="font-size: 12px; color: var(--text-muted);">All major Indian banks</div>
                                </div>
                            </label>

                            <label style="display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-sm); cursor: pointer;">
                                <input type="radio" name="paymentMethod" value="CASH_ON_DELIVERY">
                                <div>
                                    <strong>Cash on Delivery (COD)</strong>
                                    <div style="font-size: 12px; color: var(--text-muted);">Pay upon physical parcel receipt</div>
                                </div>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Order Summary & Action -->
                <div>
                    <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 24px; position: sticky; top: 90px;">
                        <h3 style="font-size: 18px; font-weight: 600; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color);">
                            Pact Review
                        </h3>

                        <div id="checkout-items-list" style="max-height: 250px; overflow-y: auto; margin-bottom: 20px;">
                            <!-- Dynamically loaded -->
                        </div>

                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; color: var(--text-muted);">
                            <span>Subtotal</span>
                            <span id="checkout-subtotal">₹0</span>
                        </div>

                        <div style="display: flex; justify-content: space-between; margin-bottom: 16px; font-size: 14px; color: var(--text-muted);">
                            <span>Shinigami Delivery</span>
                            <span id="checkout-shipping" style="color: var(--badge-green); font-weight: 600;">FREE</span>
                        </div>

                        <div style="display: flex; justify-content: space-between; padding-top: 16px; border-top: 1px solid var(--border-color); margin-bottom: 24px; font-size: 20px; font-weight: 700; color: #fff;">
                            <span>Total Due</span>
                            <span id="checkout-total-amount" style="color: var(--primary-red);">₹0</span>
                        </div>

                        <button id="place-order-btn" class="btn btn-primary btn-full btn-lg">
                            Place Order & Complete Pact
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer"></footer>

    <!-- Scripts -->
    <script src="../scripts/api.js"></script>
    <script src="../scripts/components.js"></script>
    <script src="../scripts/checkout.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderHeader('cart');
            renderFooter();
        });
    </script>
</body>
</html>
