<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Death Mart</title>
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTzSdFnao4Si8fzlM5IozWw6VlbcCylDT4Oln2I565WpQ&s=10">
    <link rel="stylesheet" href="../styles/index.css">
</head>
<body>

    <!-- Header -->
    <header class="site-header"></header>

    <main style="padding: 60px 20px; display: flex; align-items: center; justify-content: center; flex: 1;">
        <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 40px; width: 100%; max-width: 480px; box-shadow: var(--shadow-card);">
            <div style="text-align: center; margin-bottom: 28px;">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTzSdFnao4Si8fzlM5IozWw6VlbcCylDT4Oln2I565WpQ&s=10" alt="Logo" style="width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--primary-red); margin-bottom: 12px;">
                <h2 class="gothic-title" style="font-size: 26px; color: #fff;">REGISTER YOUR SOUL</h2>
                <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Join the realm of collectors, detectives, and dark intellects.</p>
            </div>

            <form id="register-form">
                <div style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px;">Full Name *</label>
                    <input type="text" id="fullName" placeholder="e.g. Light Yagami" required style="width: 100%;">
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px;">Email Address *</label>
                    <input type="email" id="email" placeholder="name@domain.com" required style="width: 100%;">
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px;">Phone Number</label>
                    <input type="tel" id="phone" placeholder="+91 9876543210" style="width: 100%;">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px;">
                    <div>
                        <label style="display: block; font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px;">Password *</label>
                        <input type="password" id="password" placeholder="Min 6 chars" required minlength="6" style="width: 100%;">
                    </div>
                    <div>
                        <label style="display: block; font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px;">Confirm *</label>
                        <input type="password" id="confirmPassword" placeholder="Confirm pass" required minlength="6" style="width: 100%;">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-bottom: 20px;">
                    Sign & Register
                </button>
            </form>

            <div style="text-align: center; font-size: 13px; color: var(--text-muted); padding-top: 16px; border-top: 1px solid var(--border-color);">
                Already have an account? <a href="./Login.html" style="color: var(--primary-red); font-weight: 600;">Sign in here</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer"></footer>

    <!-- Scripts -->
    <script src="../scripts/api.js"></script>
    <script src="../scripts/components.js"></script>
    <script src="../scripts/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderHeader('register');
            renderFooter();
        });
    </script>
</body>
</html>
