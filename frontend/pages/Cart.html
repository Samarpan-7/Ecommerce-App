<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart — Death Mart</title>
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTzSdFnao4Si8fzlM5IozWw6VlbcCylDT4Oln2I565WpQ&s=10">
    <link rel="stylesheet" href="../styles/index.css">
</head>
<body>

    <!-- Header -->
    <header class="site-header"></header>

    <main style="padding: 40px 0 80px;">
        <div class="container">
            <div style="margin-bottom: 30px;">
                <span class="section-subtitle">Your Selected Offerings</span>
                <h1 class="gothic-title" style="font-size: 38px; color: var(--text-main); margin-top: 4px;">CURSED SHOPPING CART</h1>
            </div>

            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 30px; align-items: flex-start;">
                <!-- Cart Items Container -->
                <div id="cart-items-container">
                    <div style="text-align: center; padding: 40px; color: var(--text-muted);">
                        ⏳ Summoning your cart items...
                    </div>
                </div>

                <!-- Order Summary Container -->
                <div id="cart-summary-container"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer"></footer>

    <!-- Scripts -->
    <script src="../scripts/api.js"></script>
    <script src="../scripts/components.js"></script>
    <script src="../scripts/cart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderHeader('cart');
            renderFooter();
        });
    </script>
</body>
</html>
